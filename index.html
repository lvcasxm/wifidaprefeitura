<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi Institucional | Outubro Seguro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f4f8;
      color: #243247;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #123c70;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }
    .brand {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: .3px;
    }
    header p {
      font-size: 12px;
      margin-top: 7px;
      opacity: .85;
    }
    main {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 28px 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 30px 24px;
      box-shadow: 0 5px 24px #172b4510;
      border: 1px solid #e3e8ef;
    }
    .icon {
      width: 58px;
      height: 58px;
      background: #e8f0fc;
      color: #174e8c;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 28px;
      margin: 0 auto 18px;
    }
    h1 {
      font-size: 23px;
      text-align: center;
      margin-bottom: 10px;
      color: #163e70;
    }
    .description {
      text-align: center;
      color: #66758a;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5e0;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #2865a5;
      box-shadow: 0 0 0 3px #2865a51a;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #174e8c;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #103a69;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    .notice {
      font-size: 11px;
      color: #78869a;
      line-height: 1.5;
      text-align: center;
      margin-top: 18px;
    }
    footer {
      text-align: center;
      color: #778397;
      font-size: 11px;
      padding: 18px;
    }
    #confirmation {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    #confirmation p {
      color: #66758a;
      font-size: 14px;
      line-height: 1.7;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">PREFEITURA MUNICIPAL</div>
  </header>
  <main>
    <section class="card" id="login">
      <div class="icon">⌁</div>
      <h1>Wi-Fi Institucional</h1>
      <form id="accessForm">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text"
          placeholder="Digite seu nome" required>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email"
          placeholder="exemplo@teste.com" required>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password"
          placeholder="Digite sua senha"
          autocomplete="off" required>
        <button type="submit">Solicitar acesso</button>
      </form>
    </section>
    <section class="card" id="confirmation">
      <div class="icon">✓</div>
      <h1>Solicitação recebida!</h1>
      <p>Obrigado! Seu acesso chegará em breve.</p>
    </section>
  </main>
  <footer>
    Outubro Seguro · Segurança Digital
  </footer>
<script>
  const form = document.getElementById("accessForm");
  const button = form.querySelector('button[type="submit"]');

  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    button.disabled = true;

    try {
const response = await fetch(
  "https://corsproxy.io/?" + encodeURIComponent("https://api.counterapi.dev/v2/lucass-team-3-5895/first-counter-5895/up?access_token=ut_oOTgWPtwYe0DpwI7fxtCniED0tuX7Lvc1O3lN1go"),
  { method: "GET" }
);

      if (!response.ok) {
        throw new Error("Falha ao registrar");
      }
    } catch (error) {
      console.warn("Contagem indisponível:", error);
    }

    // Sempre mostra a confirmação (mesmo se a contagem falhar)
    document.getElementById("login").style.display = "none";
    document.getElementById("confirmation").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>
</body>
</html>
